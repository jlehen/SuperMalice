name: Publier le jeu sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique, pour compter les commits
      - name: Numéro de version
        run: |
          VERSION="1.$(git rev-list --count HEAD)"
          DATE="$(TZ=Europe/Paris git log -1 --format=%cd --date=format-local:%d/%m/%Y)"
          echo "const GAME_VERSION = '$VERSION · $DATE';" > js/version.js
          cat js/version.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
